name: Refresh PhishTrap Dataset

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
    inputs:
      force_full:
        description: 'Force full rebuild from scratch'
        required: false
        type: boolean
        default: false
      max_samples:
        description: 'Max samples per class'
        required: false
        type: number
        default: 10000

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}

concurrency:
  group: phishtrap-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run PhishTrap pipeline
        run: |
          ARGS=""
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ github.event.inputs.force_full }}" == "true" ]]; then
              ARGS="$ARGS --force-full"
            fi
            ARGS="$ARGS --max-samples ${{ github.event.inputs.max_samples }}"
          fi

          # Self-healing: retry the whole run on transient failures.
          # The pipeline itself is deterministic now, but network/HF hiccups
          # can still occur - a retry with a fresh process rides them out.
          set +e
          for attempt in 1 2 3; do
            echo "::group::Pipeline attempt $attempt/3"
            python run_pipeline.py $ARGS
            rc=$?
            echo "::endgroup::"
            if [ $rc -eq 0 ]; then
              break
            fi
            echo "Pipeline attempt $attempt failed (exit $rc)"
            if [ $attempt -lt 3 ]; then
              sleep 60
            fi
          done
          exit $rc

      - name: Verify upload
        run: |
          python - <<'EOF'
          from phishtrap_pipeline.uploader import verify_upload
          assert verify_upload(), 'Post-upload verification failed'
          print('Verification passed')
          EOF

      # A push to the default branch resets GitHub's 60-day inactivity timer,
      # which otherwise silently disables this cron workflow.
      - name: Record refresh time in README
        if: always()
        run: |
          stamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          sed -i -E "s|^Last dataset refresh: .*|Last dataset refresh: ${stamp}|" README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || { git commit -m "chore: record dataset refresh at ${stamp}"; git push; }
